<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="192" height="192" viewBox="0 0 192 192" aria-hidden="true" focusable="false">
<defs><g id="mh-art"><path d="M80 39 C57 9 19 23 19 57 C19 86 49 111 80 134 C111 111 141 86 141 57 C141 23 103 9 80 39Z" fill="#D94F43" transform="translate(0 4)"/><path d="M80 39 C57 9 19 23 19 57 C19 86 49 111 80 134 C111 111 141 86 141 57 C141 23 103 9 80 39Z" fill="#FF6B5E"/></g>
<clipPath id="mh-left"><path d="M0 0H80V45L74 62L86 79L74 96L86 113L80 134V160H0Z"/></clipPath>
<clipPath id="mh-right"><path d="M80 0H160V160H80V134L86 113L74 96L86 79L74 62L80 45Z"/></clipPath></defs><style>
.mh-scene{opacity:0;animation:mh-life 750ms linear both}
.mh-enter{transform-origin:80px 80px;animation:mh-enter 180ms cubic-bezier(.2,.8,.3,1) both}
.mh-whole{animation:mh-whole 750ms steps(1,end) both}
.mh-half{opacity:0;transform-origin:80px 134px}
.mh-left{animation:mh-left 750ms linear both}
.mh-right{animation:mh-right 750ms linear both}
.mh-crack{stroke-dasharray:150;stroke-dashoffset:150;opacity:0;animation:mh-crack 750ms linear both}
@keyframes mh-life{0%,99%{opacity:1}100%{opacity:0}}
@keyframes mh-enter{0%{transform:scale(.72);opacity:0}75%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mh-whole{0%{opacity:1}24%{opacity:0}100%{opacity:0}}
@keyframes mh-left{0%,23.99%{opacity:0;transform:translate(0,0) rotate(0)}24%,46.67%{opacity:1;transform:translate(0,0) rotate(0)}73.33%{opacity:1;transform:translate(-5px,2px) rotate(-8deg)}100%{opacity:0;transform:translate(-8px,14px) rotate(-10deg)}}
@keyframes mh-right{0%,23.99%{opacity:0;transform:translate(0,0) rotate(0)}24%,46.67%{opacity:1;transform:translate(0,0) rotate(0)}73.33%{opacity:1;transform:translate(5px,2px) rotate(8deg)}100%{opacity:0;transform:translate(8px,14px) rotate(10deg)}}
@keyframes mh-crack{0%,24%{opacity:0;stroke-dashoffset:150}24.1%{opacity:1;stroke-dashoffset:150}46.67%{opacity:1;stroke-dashoffset:0}47%,100%{opacity:0;stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.mh-scene{display:none}*{animation:none!important}}
</style><g class="mh-scene" transform="translate(16 16)"><g class="mh-enter"><use class="mh-whole" href="#mh-art" xlink:href="#mh-art"/>
<g class="mh-half mh-left"><use href="#mh-art" xlink:href="#mh-art" clip-path="url(#mh-left)"/></g>
<g class="mh-half mh-right"><use href="#mh-art" xlink:href="#mh-art" clip-path="url(#mh-right)"/></g>
<path class="mh-crack" d="M80 20 L80 45 L74 62 L86 79 L74 96 L86 113 L80 134 L80 150" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
