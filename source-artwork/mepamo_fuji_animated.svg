<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 228" width="295" height="228" role="img" aria-labelledby="title desc">
  <title id="title">Mepamo Mount Fuji with a gently moving sun</title>
  <desc id="desc">A cream snowcap, teal mountain and mint foothills. The golden sun slowly rises and settles behind the mountain.</desc>
  <style>
    /* Change 3.6s to adjust speed; change -7px to adjust travel. */
    .sun { animation: sunrise 3.6s ease-in-out infinite; }
    @keyframes sunrise {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sun { animation: none; }
    }
  </style>
  <defs>
    <path id="mountain" d="M59 178 L139 66 Q143 60 150 60 H181 Q187 60 191 68 L250 177 Q258 192 245 193 H69 Q52 193 59 178 Z"/>
    <clipPath id="mountain-clip"><use href="#mountain"/></clipPath>
  </defs>

  <!-- Sun is drawn first so the mountain hides its lower edge. -->
  <g class="sun">
    <circle cx="196" cy="63" r="29" fill="#F6C840" stroke="#75502F" stroke-width="3.5"/>
  </g>

  <!-- Soft sticker edge, then mountain fill and snowcap. -->
  <use href="#mountain" fill="none" stroke="#EEEDE7" stroke-width="12" stroke-linejoin="round" transform="translate(-1 2)"/>
  <g clip-path="url(#mountain-clip)">
    <use href="#mountain" fill="#307C68"/>
    <path d="M129 59 H188 L215 104 Q204 112 195 97 Q189 84 184 100 Q179 119 169 101 Q162 84 157 102 Q152 118 143 107 Q138 99 133 109 Q126 119 123 104 Q119 91 108 109 L96 105 Z" fill="#FFFEF4"/>
    <!-- Back foothill, then front foothill. -->
    <path d="M133 168 Q169 130 204 149 Q228 152 245 173 Q256 183 253 193 H121 Z" fill="#BCE5A4" stroke="#75502F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M55 184 Q87 130 123 162 L135 168 Q162 162 181 193 H59 Z" fill="#BCE5A4" stroke="#75502F" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <use href="#mountain" fill="none" stroke="#75502F" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
